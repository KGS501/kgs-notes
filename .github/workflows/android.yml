name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: editor/web/pnpm-lock.yaml
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify bundled editor assets
        run: |
          pnpm --dir editor/web install --frozen-lockfile
          pnpm --dir editor/web build
          git diff --exit-code -- editor/src/main/assets
      - name: Test, lint, and assemble
        run: ./gradlew :notes-engine:test :source:nextcloud:test :editor:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: editor/web/pnpm-lock.yaml
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test development tooling
        run: |
          bash tools/test-android-emulator.sh
          tools/instrumentation-suites.sh --check
      - name: Verify bundled editor assets
        run: |
          pnpm --dir editor/web install --frozen-lockfile
          pnpm --dir editor/web build
          git diff --exit-code -- editor/src/main/assets
      - name: Test editor bundle (rendering, source preservation, advisories)
        working-directory: editor/web
        run: node --test test/*.test.mjs
      - name: Test, lint, and assemble app and instrumentation APKs
        run: ./gradlew --console=plain :notes-engine:test :source:nextcloud:test :editor:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Offline emulator integration. Live Nextcloud tests skip themselves unless the
  # KGS_TEST_NEXTCLOUD_* variables are set, and this job never provides them.
  instrumentation:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported platform (minSdk 26). Its stock WebView lacks
          # WebMessageListener, so Rich-only suites are covered on API 36 instead.
          - name: api26-phone-minimum
            api-level: 26
            profile: pixel_2
            suite: minimum
            timeout: 50
          # Representative recent platform: every committed instrumentation test,
          # including German chrome and forced tablet/foldable sizes.
          - name: api36-phone-full
            api-level: 36
            profile: pixel_6
            suite: full
            timeout: 90
          # Real large-screen device profile for adaptive layouts.
          - name: api36-tablet-adaptive
            api-level: 36
            profile: pixel_tablet
            suite: adaptive
            timeout: 50
    name: instrumentation (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation APKs
        run: ./gradlew --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: mkdir -p app/build/device-logs && (adb logcat -c || true) && (./gradlew --console=plain :app:connectedDebugAndroidTest $(tools/instrumentation-suites.sh ${{ matrix.suite }}); status=$?; adb logcat -d -v threadtime > app/build/device-logs/logcat.txt; exit $status)
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-${{ matrix.name }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/device-logs/
          if-no-files-found: warn
          retention-days: 14
